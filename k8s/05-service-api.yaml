# Service de la API: IP y nombre DNS estables ("api") delante de las 3
# replicas; kube-proxy reparte las conexiones entre los pods listos.
# ClusterIP: solo accesible dentro del cluster; desde fuera se entra por
# la web (Nginx), igual que en Compose.
# Se llama "api" (como el servicio de Compose) para que frontend/nginx
# use la misma configuracion (proxy_pass http://api:8000) en ambos entornos.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ingweb
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: ingweb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      # Por nombre: si cambia el puerto del contenedor, el Service no se toca.
      targetPort: http
