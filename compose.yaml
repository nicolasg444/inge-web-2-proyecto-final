# compose.yaml - entorno completo: mysql + redis + api-init + api + web.
#
# Produccion local (sin el override de desarrollo):
#   docker compose -f compose.yaml up -d --build
# Desarrollo (aplica compose.override.yaml automaticamente):
#   docker compose up -d --build
#
# Sin clave "version": esta obsoleta en Compose v2 y solo genera avisos.

# Nombre del proyecto: prefijo de contenedores, redes y volumenes.
name: ingweb

# Bloque reutilizable (ancla YAML) con lo que comparten api-init y api, para
# no repetir variables y que nunca diverjan. Compose ignora claves "x-".
x-api-comun: &api-comun
  build:
    context: .
    # Solo la etapa runtime: sin pytest ni herramientas de desarrollo.
    target: runtime
    args:
      APP_VERSION: ${APP_VERSION:-1.0}
  image: ingweb-api:${APP_VERSION:-1.0}
  environment:
    # --- Configuracion NO secreta (se puede ver en docker inspect) ---
    DB_HOST: mysql
    DB_PORT: "3306"
    # Nombre y usuario de la base son constantes del despliegue, no
    # secretos. No se leen de .env a proposito: el .env de desarrollo local
    # suele tener DB_USER=root y MySQL no permite usarlo como usuario de app.
    DB_NAME: ingenieria_web
    DB_USER: ingweb
    REDIS_HOST: redis
    CACHE_TTL: ${CACHE_TTL:-30}
    JWT_EXP_HOURS: ${JWT_EXP_HOURS:-8}
    APP_VERSION: ${APP_VERSION:-1.0}
    # --- Secretos: solo la RUTA al archivo, nunca el valor ---
    JWT_SECRET_FILE: /run/secrets/jwt_secret
    DB_PASSWORD_FILE: /run/secrets/db_password
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
  secrets:
    - jwt_secret
    - db_password
    - redis_password
  # Sistema de archivos raiz de solo lectura: si alguien explota la app no
  # puede dejar binarios ni modificar codigo. Solo /tmp es escribible (RAM).
  read_only: true
  tmpfs:
    - /tmp
  # Quita TODAS las capabilities de Linux: una app web en el puerto 8000 no
  # necesita ninguna (ni cambiar duenos, ni red cruda, ni montar nada).
  cap_drop:
    - ALL
  # Impide ganar privilegios via binarios setuid (p. ej. su, passwd).
  security_opt:
    - "no-new-privileges:true"
  networks:
    - backend

services:

  mysql:
    # Version fija (8.4 = rama LTS de MySQL).
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: ingenieria_web
      MYSQL_USER: ingweb
      # La imagen oficial soporta *_FILE: lee la contrasena del secreto y
      # no queda en la configuracion del contenedor.
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - db_password
      - mysql_root_password
    volumes:
      # Volumen nombrado: los datos sobreviven a "down" (no a "down -v").
      - mysql-data:/var/lib/mysql
    # Sin "ports": la base solo es accesible desde la red backend. Ademas el
    # 3306 del anfitrion suele estar ocupado por un MySQL local.
    networks:
      - backend
    healthcheck:
      # Por TCP (127.0.0.1) y no por socket: durante la inicializacion la
      # imagen levanta un servidor temporal sin red; asi el healthcheck solo
      # pasa cuando el servidor definitivo esta listo.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  redis:
    # Version fija. Alpine: imagen pequena y Redis no necesita mas.
    image: redis:7.4.6-alpine
    # La contrasena se lee del secreto al arrancar ("$$" escapa "$" para que
    # lo expanda el shell del contenedor y no Compose). Asi no aparece en
    # docker inspect. "exec" deja a redis-server como PID 1 (recibe SIGTERM).
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis-data:/data
    # SOLO backend: ni la web ni el anfitrion llegan a Redis.
    networks:
      - backend
    healthcheck:
      # ping AUTENTICADO: un Redis que arranco sin contrasena no pasaria.
      # REDISCLI_AUTH evita pasar la contrasena como argumento visible.
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
    # Usuario redis (UID 999, GID 1000) desde el arranque. Necesario porque
    # el entrypoint oficial solo baja de root a redis cuando el comando
    # empieza por "redis-server"; con "sh -c" seguiria como root.
    user: "999:1000"
    # Solo /data (volumen) es escribible.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

  # Tarea de una sola vez: crea las tablas (idempotente) antes de la API.
  api-init:
    <<: *api-comun
    command: ["python", "init_db.py"]
    depends_on:
      mysql:
        condition: service_healthy
    # Termina y se queda en "Exited (0)": no se reinicia.
    restart: "no"

  api:
    <<: *api-comun
    depends_on:
      api-init:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # backend: habla con mysql y redis. frontend: la web necesita llegar a
    # la API, y la red backend es "internal" (sin salida ni entrada externa).
    networks:
      - backend
      - frontend
    healthcheck:
      # Mismo chequeo que el HEALTHCHECK del Dockerfile, explicito aqui para
      # verlo en la socializacion. /health no consulta MySQL ni Redis.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Sin "ports": solo se entra por Nginx.
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    image: ingweb-web:1.0
    depends_on:
      api:
        condition: service_healthy
    # El UNICO puerto publicado. WEB_PORT permite cambiarlo si el 8080 del
    # anfitrion esta ocupado (p. ej. por Apache/XAMPP).
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/salud-web"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Nginx unprivileged guarda pid y temporales en /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped

networks:
  # Red de entrada: web <-> api.
  frontend: {}
  # Red de datos: internal = sin acceso a/desde fuera de Docker. Ni siquiera
  # un puerto publicado por error seria alcanzable.
  backend:
    internal: true

volumes:
  mysql-data: {}
  redis-data: {}

# Secretos de Compose: archivos montados en /run/secrets/<nombre> (solo
# lectura). NO son variables de entorno: no aparecen en docker inspect ni en
# los logs. Se generan con scripts/generar-secretos.sh y secrets/ esta en
# .gitignore.
secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  db_password:
    file: ./secrets/db_password.txt
  mysql_root_password:
    file: ./secrets/mysql_root_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
