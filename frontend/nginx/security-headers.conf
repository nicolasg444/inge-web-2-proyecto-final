# Cabeceras de seguridad de la pagina web (HTML/JS/CSS servidos por Nginx).
# Equivalen a las que pone Flask en la API (app/__init__.py), pero la CSP
# permite cargar los recursos propios ('self'): la API es mas estricta
# ("default-src 'none'") porque solo devuelve JSON.
#
# "always": se envian tambien en respuestas de error (404, 500...).
# Este archivo se incluye SOLO en las locations de estaticos: si se pusiera
# a nivel server, Nginx tambien las agregaria a las respuestas de la API y
# quedarian duplicadas (dos CSP = el navegador aplica ambas).
#
# CSP: el build de Vite no usa scripts ni estilos en linea, asi que no hace
# falta 'unsafe-inline'. connect-src 'self': React solo habla con su propio
# origen (Nginx reenvia /api a Flask). frame-ancestors 'none' = anti
# clickjacking (version moderna de X-Frame-Options).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Impide que el navegador "adivine" el tipo de contenido (MIME sniffing).
add_header X-Content-Type-Options "nosniff" always;
# Anti clickjacking para navegadores que no entienden frame-ancestors.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Solo tiene efecto sobre HTTPS (TLS en Front Door / Ingress en produccion).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
