# Servidor web: sirve el build de React y reenvia la API a Flask.
# Reemplaza /etc/nginx/conf.d/default.conf de la imagen
# nginxinc/nginx-unprivileged (su nginx.conf principal ya guarda el pid y
# los temporales en /tmp, por eso funciona con raiz de solo lectura).

server {
    # 8080: un proceso sin privilegios no puede abrir puertos < 1024.
    listen 8080;
    server_name _;

    # No anunciar la version de Nginx en cabeceras ni paginas de error.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- API (Flask) -------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/proxy-api.conf;
    }
    # Healthcheck y demostracion de balanceo de la API.
    location = /health {
        include /etc/nginx/snippets/proxy-api.conf;
    }
    location = /quien {
        include /etc/nginx/snippets/proxy-api.conf;
    }

    # Salud del propio Nginx: NO depende de la API (si dependiera, una caida
    # de la API haria reiniciar tambien los pods web sin motivo).
    location = /salud-web {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- Estaticos ---------------------------------------------------------
    # Vite pone un hash en el nombre de cada archivo de /assets: si cambia
    # el contenido cambia el nombre, asi que se pueden cachear un ano.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # index.html siempre se revalida para tomar el build nuevo.
        add_header Cache-Control "no-cache" always;
        # La app no tiene enrutador del lado del cliente: no hace falta el
        # fallback a index.html; una ruta inexistente es un 404 real.
        try_files $uri $uri/ =404;
    }
}
