# Reenvio a la API Flask. "api" es el nombre del servicio en Compose y del
# Service en Kubernetes: el mismo nginx.conf sirve en ambos entornos.
#
# SIN barra final en proxy_pass: la ruta llega intacta (/api/proyectos ->
# /api/proyectos). Con "http://api:8000/" Nginx quitaria el prefijo /api/ y
# Flask responderia 404, porque sus rutas incluyen /api.
proxy_pass http://api:8000;

# Host original y datos del cliente real (si no, Flask veria la IP de Nginx).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Authorization (JWT), Cookie y cualquier otra cabecera de la peticion se
# reenvian por defecto, y Set-Cookie de la respuesta tambien pasa: no se
# declaran aqui a proposito, porque proxy_set_header con un valor vacio las
# eliminaria.

# Las cabeceras de seguridad de la API vienen de Flask; aqui no se agrega
# ninguna para no duplicarlas.
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
